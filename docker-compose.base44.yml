services:
  web:
    image: node:20-slim
    working_dir: /app
    labels:
      base44.project: Netflix Clone
      base44.kind: web
      base44.port: 3000
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    env_file:
      # Local placeholders first, so real values from the platform always win.
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      - BASE44_PREVIEW_MODE
      # Bind mounts on the sandbox do not forward filesystem events reliably.
      - CHOKIDAR_USEPOLLING=true
    command:
      - sh
      - -ec
      - |
        npm ci --no-audit --no-fund
        exec npm run dev -- --host 0.0.0.0 --port 3000 --strictPort
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
    restart: on-failure

volumes:
  node_modules:
